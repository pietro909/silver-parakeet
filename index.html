<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0014" />
<title>Pizzata di Classe — 2003/2004</title>
<meta name="description" content="Mancano X giorni alla pizzata della classe che si è diplomata nell'anno scolastico 2003/2004." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍕</text></svg>" />

<style>
  :root {
    --bg-0: #0a0014;
    --bg-1: #1a0028;
    --accent: #ff2e88;
    --accent-2: #7c3aed;
    --accent-3: #f7d046;
    --text: #fff8f0;
    --muted: #c9b8ff;
    --card: rgba(255, 255, 255, 0.06);
    --card-stroke: rgba(255, 255, 255, 0.14);
    --shadow-glow: 0 0 60px rgba(255, 46, 136, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    background: var(--bg-0);
    overflow-x: hidden;
    min-height: 100vh;
    min-height: 100dvh;
    position: relative;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Animated mesh-gradient background */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
      radial-gradient(circle at 15% 20%, #ff2e88 0%, transparent 40%),
      radial-gradient(circle at 85% 15%, #7c3aed 0%, transparent 45%),
      radial-gradient(circle at 75% 85%, #f7d046 0%, transparent 35%),
      radial-gradient(circle at 20% 90%, #06b6d4 0%, transparent 40%),
      linear-gradient(135deg, #0a0014, #1a0028);
    filter: saturate(1.15);
    animation: hue 24s linear infinite;
  }
  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 0%, rgba(10, 0, 20, 0.6) 80%);
  }

  @keyframes hue {
    0%, 100% { filter: saturate(1.15) hue-rotate(0deg); }
    50%      { filter: saturate(1.3)  hue-rotate(40deg); }
  }

  /* Grain overlay for that filmic vibe */
  .grain {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0.06;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='1'/></svg>");
  }

  /* Floating emoji layer */
  .floaters {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .floaters span {
    position: absolute;
    bottom: -10vh;
    font-size: clamp(1.2rem, 2.5vw, 2rem);
    opacity: 0.5;
    animation: float linear infinite;
    filter: drop-shadow(0 0 8px rgba(255, 46, 136, 0.4));
    user-select: none;
  }
  @keyframes float {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.55; }
    90%  { opacity: 0.55; }
    100% { transform: translateY(-115vh) rotate(720deg); opacity: 0; }
  }

  /* Main layout */
  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 4vh 5vw;
    text-align: center;
  }

  .pre-title {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-size: clamp(0.75rem, 1.2vw, 0.95rem);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
    opacity: 0;
    animation: fade-in 1.4s 0.2s forwards;
  }

  h1 {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-weight: 900;
    font-size: clamp(2.4rem, 8vw, 6rem);
    line-height: 1;
    background: linear-gradient(120deg, #fff 0%, #ffd1ec 30%, #f7d046 60%, #fff 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 60px rgba(255, 46, 136, 0.25);
    animation: shimmer 5s ease-in-out infinite, fade-in 1.2s forwards;
    letter-spacing: -0.02em;
    margin-bottom: 3rem;
  }

  h1 .amp {
    font-style: italic;
    font-weight: 400;
    color: #f7d046;
    -webkit-text-fill-color: #f7d046;
    text-shadow: 0 0 30px rgba(247, 208, 70, 0.45);
  }

  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* Countdown grid */
  .countdown {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: clamp(0.6rem, 1.8vw, 1.5rem);
    width: 100%;
    max-width: 900px;
    opacity: 0;
    animation: fade-in 1.2s 0.8s forwards;
  }

  .unit {
    position: relative;
    background: var(--card);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid var(--card-stroke);
    border-radius: clamp(14px, 1.6vw, 24px);
    padding: clamp(1rem, 2.5vw, 1.8rem) clamp(0.4rem, 1vw, 1rem) clamp(0.7rem, 1.6vw, 1.2rem);
    box-shadow:
      0 10px 40px rgba(0, 0, 0, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transition: transform 0.3s ease;
  }
  .unit:hover { transform: translateY(-4px); }

  .unit::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(135deg, rgba(255, 46, 136, 0.5), rgba(124, 58, 237, 0.3), transparent);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }

  .number {
    font-family: 'Space Grotesk', 'Inter', monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: clamp(2rem, 8vw, 5rem);
    line-height: 1;
    background: linear-gradient(180deg, #fff 0%, #ffd1ec 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(255, 46, 136, 0.3);
    display: inline-block;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .number.tick { animation: pop 0.35s ease; }
  @keyframes pop {
    0%   { transform: scale(1)   rotate(0deg); }
    40%  { transform: scale(1.18) rotate(-3deg); filter: brightness(1.3); }
    100% { transform: scale(1)   rotate(0deg); }
  }

  .label {
    display: block;
    margin-top: 0.6rem;
    font-size: clamp(0.65rem, 1.1vw, 0.85rem);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0.9;
  }

  /* The seconds card pulses every tick */
  .unit.seconds .number {
    background: linear-gradient(180deg, #fff 0%, #f7d046 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }

  /* Aperitivo CTA */
  .aperitivo {
    margin-top: 3rem;
    display: flex;
    justify-content: center;
    opacity: 0;
    animation: fade-in 1.2s 1.1s forwards;
  }
  .aperitivo a {
    display: inline-flex;
    align-items: center;
    gap: 0.7rem;
    background: linear-gradient(135deg, rgba(255, 46, 136, 0.18), rgba(124, 58, 237, 0.18));
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    padding: clamp(0.85rem, 1.6vw, 1.15rem) clamp(1.4rem, 3vw, 2rem);
    font-size: clamp(1rem, 1.8vw, 1.25rem);
    font-weight: 500;
    letter-spacing: 0.01em;
    color: #fff;
    text-decoration: none;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow:
      0 12px 40px rgba(255, 46, 136, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.12);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    text-align: center;
  }
  .aperitivo a:hover {
    transform: translateY(-3px) scale(1.02);
    border-color: var(--accent);
    box-shadow:
      0 18px 50px rgba(255, 46, 136, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.18);
  }
  .aperitivo .arrow {
    transition: transform 0.25s ease;
  }
  .aperitivo a:hover .arrow { transform: translateX(4px); }

  .date-line {
    margin-top: 2.5rem;
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(0.8rem, 1.3vw, 0.95rem);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
    animation: fade-in 1.2s 1.4s forwards;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 0.4rem 0.9rem;
  }
  .date-line strong {
    color: var(--accent-3);
    font-weight: 600;
    letter-spacing: 0.15em;
  }
  .date-line .dim { opacity: 0.7; }
  .date-line .sep { opacity: 0.5; }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* It's time! state */
  .arrived {
    text-align: center;
  }
  .arrived h1 {
    font-size: clamp(3rem, 12vw, 9rem);
    animation: shimmer 2s ease-in-out infinite, party 1.4s ease-in-out infinite;
  }
  @keyframes party {
    0%, 100% { transform: rotate(-2deg) scale(1); }
    50%      { transform: rotate(2deg)  scale(1.05); }
  }

  /* Responsive: stack on phones */
  @media (max-width: 540px) {
    .countdown {
      grid-template-columns: repeat(2, 1fr);
      max-width: 380px;
    }
    .pre-title { letter-spacing: 0.3em; }
    h1 { letter-spacing: -0.01em; }
    .date-line {
      flex-direction: column;
      gap: 0.5rem;
    }
    .date-line .sep { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001s !important;
      animation-iteration-count: 1 !important;
      transition: none !important;
    }
    .bg { animation: none; }
    .floaters { display: none; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="grain"></div>
<div class="floaters" id="floaters" aria-hidden="true"></div>

<main id="app">
  <p class="pre-title">⚠ Maturità 2003 · reunion ufficiale ⚠</p>
  <h1>A volte <span class="amp">ritornano</span>…</h1>

  <section class="countdown" aria-label="Tempo rimanente alla pizzata">
    <div class="unit days">
      <span class="number" id="d">--</span>
      <span class="label">Giorni</span>
    </div>
    <div class="unit hours">
      <span class="number" id="h">--</span>
      <span class="label">Ore</span>
    </div>
    <div class="unit minutes">
      <span class="number" id="m">--</span>
      <span class="label">Minuti</span>
    </div>
    <div class="unit seconds">
      <span class="number" id="s">--</span>
      <span class="label">Secondi</span>
    </div>
  </section>

  <div class="aperitivo">
    <a href="https://maps.app.goo.gl/eoq4UbKDwgXAeP6v5" target="_blank" rel="noopener noreferrer">
      <span>🥂</span>
      <span>L'aperitivo per prepararsi alla serata</span>
      <span class="arrow">↗</span>
    </a>
  </div>

  <p class="date-line">
    <strong>22 · 05 · 2026</strong>
    <span class="sep" aria-hidden="true">·</span>
    <span>ore 20:00 (ora italiana)</span>
    <span class="sep" aria-hidden="true">·</span>
    <span class="dim">Sezione B</span>
  </p>
</main>

<script>
  // Target: 22 May 2026, 18:00 UTC == 20:00 Italian summer time.
  const TARGET = new Date(Date.UTC(2026, 4, 22, 18, 0, 0));

  const $d = document.getElementById('d');
  const $h = document.getElementById('h');
  const $m = document.getElementById('m');
  const $s = document.getElementById('s');
  const $app = document.getElementById('app');

  const pad = (n) => String(n).padStart(2, '0');

  // Track previous values so we only pop the number when it actually changes
  let prev = { d: null, h: null, m: null, s: null };

  function setNum(el, val, key) {
    const text = pad(val);
    if (el.textContent !== text) {
      el.textContent = text;
      if (prev[key] !== null) {
        el.classList.remove('tick');
        // force reflow so the animation can restart
        void el.offsetWidth;
        el.classList.add('tick');
      }
      prev[key] = val;
    }
  }

  function tick() {
    const now = Date.now();
    const diff = TARGET.getTime() - now;

    if (diff <= 0) {
      arrive();
      return false;
    }

    const days    = Math.floor(diff / 86400000);
    const hours   = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);

    setNum($d, days,    'd');
    setNum($h, hours,   'h');
    setNum($m, minutes, 'm');
    setNum($s, seconds, 's');
    return true;
  }

  // Confetti / party state when we hit zero
  function arrive() {
    $app.classList.add('arrived');
    $app.innerHTML = `
      <p class="pre-title">SEI IN RITARDO, CAZZO!</p>
      <h1>🍕 Pizza time! 🍺</h1>
    `;
    launchConfetti();
    setInterval(launchConfetti, 1800);
  }

  // Lightweight confetti, no dependencies
  function launchConfetti() {
    const colors = ['#ff2e88', '#7c3aed', '#f7d046', '#06b6d4', '#fff'];
    for (let i = 0; i < 80; i++) {
      const c = document.createElement('div');
      c.style.cssText = `
        position: fixed;
        top: -20px;
        left: ${Math.random() * 100}vw;
        width: ${6 + Math.random() * 8}px;
        height: ${10 + Math.random() * 14}px;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        opacity: ${0.7 + Math.random() * 0.3};
        transform: rotate(${Math.random() * 360}deg);
        border-radius: 2px;
        z-index: 5;
        pointer-events: none;
        animation: fall ${2 + Math.random() * 3}s linear forwards;
      `;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
  }

  // Inject confetti keyframes once
  const style = document.createElement('style');
  style.textContent = `
    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }
  `;
  document.head.appendChild(style);

  // Spawn floating emoji background
  (function spawnFloaters() {
    const layer = document.getElementById('floaters');
    const emojis = ['🍕','🍕','🍕','🍺','🥤','🌶️','🧀','🍅','🌿','🔥','✨','🎉','💃','🕺','📼','💾','📟','📀'];
    const count = window.matchMedia('(max-width: 600px)').matches ? 14 : 28;
    for (let i = 0; i < count; i++) {
      const s = document.createElement('span');
      s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      s.style.left = (Math.random() * 100) + 'vw';
      s.style.animationDuration = (14 + Math.random() * 22) + 's';
      s.style.animationDelay = (-Math.random() * 25) + 's';
      s.style.fontSize = (0.9 + Math.random() * 1.8) + 'rem';
      layer.appendChild(s);
    }
  })();

  // Start ticking
  if (tick()) {
    setInterval(tick, 1000);
  }

  // Easter egg: secret konami-ish — press "P" for an extra confetti burst
  window.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'p') launchConfetti();
  });
</script>

</body>
</html>
